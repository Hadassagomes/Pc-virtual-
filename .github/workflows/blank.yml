name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Iniciando o PC Virtual
      run: |
        echo "Iniciando a instancia ${{ github.event.inputs.instance }}..."
        
    - name: Manter ativo
      run: |
        i=0
        while [ $i -lt 360 ]; do
            sleep 60
            i=$((i+1))
            echo "Instancia rodando há $i minutos..."
        done
